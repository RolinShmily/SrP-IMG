name: Test

# Pull requests only: pushes to main are already built and deployed by
# deploy.yml, so running there too would just duplicate the work.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # --no-copy writes placeholder files instead of duplicating every image,
      # which keeps the job fast; the metadata and Worker data modules are
      # generated identically to a full run.
      - name: Generate hashed image sets
        run: python -m pipeline --no-copy --hash-length 2

      # Catch stale committed artifacts (the image pool itself is git-ignored).
      # slot_formats.js is derived from source headers only, so --no-copy
      # produces the same bytes as a full run.
      - name: Verify generated data is in sync
        run: git diff --exit-code -- worker/targets.js worker/slot_formats.js assets/generated/counts.json

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      # vite build transpiles without typechecking, so type errors do not fail
      # the build above — this step is the actual gate.
      - name: Typecheck
        run: npm run typecheck
